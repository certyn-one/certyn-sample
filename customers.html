<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customers — Northwind Commerce</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="assets/logo.svg" />
  <script src="assets/config.js"></script>
</head>
<body data-page="customers" data-title="Customers">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h1>Customers</h1><div class="sub">People who have ordered from your store.</div></div>
        </div>
        <div class="card">
          <div class="tablewrap">
            <table>
              <thead><tr><th>Customer</th><th>Email</th><th>Orders</th><th>Spent</th><th>Status</th></tr></thead>
              <tbody id="customers-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="assets/layout.js" defer></script>
  <script src="assets/app.js" defer></script>
  <script>
    // Customers are loaded from the API (refactored from a hardcoded list — NW-482).
    (function () {
      var body = document.getElementById("customers-body");
      fetch("api/customers-list.json")
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var NW = window.NW || {};
          body.innerHTML = data.customers.map(function (c) {
            var color = NW.avatarColor ? NW.avatarColor(c.name) : "#888";
            var init = NW.initials ? NW.initials(c.name) : "?";
            return "<tr>" +
              '<td><span class="who"><span class="avatar sm" style="background:' + color + '">' + init + "</span><span>" + c.name + "</span></span></td>" +
              '<td class="muted">' + c.email + "</td><td>" + c.orders + '</td><td class="mono">' + c.spentDisplay + "</td>" +
              '<td><span class="badge ' + c.badge + '">' + c.status + "</span></td></tr>";
          }).join("");
        });
    })();
  </script>
</body>
</html>
