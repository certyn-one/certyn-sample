<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders — Northwind Commerce</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="assets/logo.svg" />
  <script src="assets/config.js"></script>
</head>
<body data-page="orders" data-title="Orders">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>Orders</h1>
            <div class="sub">Served live from <code>/api/orders</code>, documented by
              <a href="openapi.yaml" style="color:var(--primary)">openapi.yaml</a>.</div>
          </div>
          <div class="actions">
            <span class="badge gray">Revenue: <strong id="revenue-summary" class="mono">…</strong></span>
            <button id="recalc" class="btn ghost">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
              Recalculate totals
            </button>
          </div>
        </div>

        <div class="card">
          <div class="card-h">
            <div class="tabs" id="order-tabs">
              <button class="active" data-filter="all">All</button>
              <button data-filter="paid">Paid</button>
              <button data-filter="pending">Pending</button>
              <button data-filter="fulfilled">Fulfilled</button>
              <button data-filter="refunded">Refunded</button>
            </div>
            <span class="meta" id="recalc-note"></span>
          </div>
          <div class="tablewrap">
            <table>
              <thead>
                <tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Placed</th></tr>
              </thead>
              <tbody id="orders-body">
                <tr><td colspan="5" class="note">Loading orders…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="foot-row">
            <span class="muted">Showing 8 of 8 orders</span>
            <div class="actions">
              <button class="btn ghost" disabled>Previous</button>
              <button class="btn ghost" disabled>Next</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="assets/layout.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
